name: Build, test, and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore ChampollionGraphicalUserInterface.slnx
      - name: Test
        run: dotnet test ChampollionGraphicalUserInterface.slnx -c Release --no-restore
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "2.0.0-ci.${{ github.run_number }}" }
          ./scripts/package-windows.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/packages/*-win-x64-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release create "${{ github.ref_name }}" artifacts/* --generate-notes --verify-tag; then
            gh release upload "${{ github.ref_name }}" artifacts/* --clobber
          fi
